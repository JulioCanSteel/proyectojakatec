<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeroesMX | Iniciar Sesión</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Equivalente a AppTheme */
        :root {
            --primary-teal: #008080; /* Cambia este hex por el de tu AppTheme.primaryTeal */
            --border-radius: 12px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff; /* AppTheme.white */
        }

        /* SafeArea & Center & SingleChildScrollView */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 400px; /* Limita el ancho en pantallas grandes */
        }

        /* Utilidades de color */
        .text-teal { color: var(--primary-teal) !important; }
        
        /* Estilos de inputs (OutlineInputBorder) */
        .form-control, .input-group-text {
            border-radius: var(--border-radius);
            padding: 12px 16px;
            border-color: #ced4da; /* Colors.grey */
        }
        
        .input-group:focus-within .form-control, 
        .input-group:focus-within .input-group-text {
            border-color: var(--primary-teal);
            box-shadow: none;
            border-width: 2px;
        }

        /* Estilos de botones (ElevatedButton & OutlinedButton) */
        .btn-teal {
            background-color: var(--primary-teal);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 16px;
            font-weight: 700;
        }
        
        .btn-teal:hover, .btn-teal:focus {
            background-color: #006666;
            color: white;
        }
        
        .btn-teal:disabled {
            background-color: #bdbdbd; /* Colors.grey[400] */
            color: white;
        }

        .btn-outline-teal {
            border: 2px solid var(--primary-teal);
            color: var(--primary-teal);
            border-radius: var(--border-radius);
            padding: 16px;
            font-weight: 700;
            background-color: transparent;
        }

        .btn-outline-teal:hover {
            background-color: var(--primary-teal);
            color: white;
        }

        /* Ícono principal */
        .main-icon {
            font-size: 5rem;
            line-height: 1;
        }
    </style>
    <link rel="stylesheet" href="../app.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-container text-center">
            
            <!-- Logo -->
            <i class="bi bi-lock main-icon text-teal mb-3 d-block"></i>

            <div class="app-brand mb-1">HeroesMX</div>

            <!-- Títulos -->
            <h1 class="text-teal fw-bold fs-3 mb-2">Bienvenido</h1>
            <p class="text-muted fs-6 mb-4">Ingresa tus credenciales para continuar</p>

            <form id="loginForm" novalidate>
                
                <!-- Input de Correo -->
                <div class="mb-3 text-start">
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-envelope text-teal"></i>
                        </span>
                        <input type="email" class="form-control border-start-0 ps-0" id="emailInput" placeholder="Correo Electrónico" required>
                        <div class="invalid-feedback" id="emailError">Por favor, ingresa tu correo</div>
                    </div>
                </div>

                <!-- Input de Contraseña -->
                <div class="mb-4 text-start">
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-lock text-teal"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="passwordInput" placeholder="Contraseña" required>
                        <span class="input-group-text bg-white border-start-0" id="togglePassword" style="cursor: pointer;">
                            <i class="bi bi-eye-slash text-secondary" id="toggleIcon"></i>
                        </span>
                        <div class="invalid-feedback" id="passwordError">Por favor, ingresa tu contraseña</div>
                    </div>
                </div>

                <!-- Botón de Ingresar -->
                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-teal d-flex justify-content-center align-items-center" id="loginBtn">
                        <span id="btnText">Iniciar Sesión</span>
                        <div class="spinner-border spinner-border-sm text-light ms-2 d-none" id="loginSpinner" role="status"></div>
                    </button>
                </div>

                <!-- Divider -->
                <div class="d-flex align-items-center mb-3">
                    <hr class="flex-grow-1 text-secondary opacity-25">
                    <span class="mx-3 text-secondary">o</span>
                    <hr class="flex-grow-1 text-secondary opacity-25">
                </div>

                <!-- Botón de Registro -->
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-outline-teal" onclick="window.location.href='../signup/signup.html'">Crear Cuenta</button>
                </div>

                <div class="mt-4">
                    <a class="small text-teal text-decoration-none" href="../admin/index.html">
                        <i class="bi bi-shield-lock me-1"></i>Acceso para personal administrativo
                    </a>
                </div>
                
            </form>
        </div>
    </div>

    <!-- Equivalente a ScaffoldMessenger (SnackBar) -->
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
        <div id="errorSnackBar" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="snackBarMessage">Error en la autenticación</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Referencias del DOM
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');
            const togglePassword = document.getElementById('togglePassword');
            const toggleIcon = document.getElementById('toggleIcon');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loginSpinner = document.getElementById('loginSpinner');
            
            // Instancia de Toast de Bootstrap para emular el SnackBar
            const toastEl = document.getElementById('errorSnackBar');
            const snackBar = new bootstrap.Toast(toastEl, { delay: 4000 });
            const snackBarMessage = document.getElementById('snackBarMessage');

            // RegEx de Flutter simplificado para JS
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            // Funcionalidad: _isPasswordVisible
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.classList.toggle('bi-eye');
                toggleIcon.classList.toggle('bi-eye-slash');
            });

            // Funcionalidad: _formKey.currentState!.validate() y _submitLogin()
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Evita recargar la página
                let isValid = true;

                // Validación de correo
                if (!emailInput.value.trim()) {
                    emailInput.classList.add('is-invalid');
                    emailError.textContent = 'Por favor, ingresa tu correo';
                    isValid = false;
                } else if (!emailRegex.test(emailInput.value.trim())) {
                    emailInput.classList.add('is-invalid');
                    emailError.textContent = 'Ingresa un correo válido';
                    isValid = false;
                } else {
                    emailInput.classList.remove('is-invalid');
                }

                // Validación de contraseña
                if (!passwordInput.value) {
                    passwordInput.classList.add('is-invalid');
                    passwordError.textContent = 'Por favor, ingresa tu contraseña';
                    isValid = false;
                } else if (passwordInput.value.length < 6) {
                    passwordInput.classList.add('is-invalid');
                    passwordError.textContent = 'La contraseña debe tener al menos 6 caracteres';
                    isValid = false;
                } else {
                    passwordInput.classList.remove('is-invalid');
                }

                // Si _formKey.currentState!.validate() es true
                if (isValid) {
                    // setState(() => _isLoading = true)
                    loginBtn.disabled = true;
                    btnText.textContent = '';
                    loginSpinner.classList.remove('d-none');

                    try {
                        const user = await window.CivicAuth.login(emailInput.value.trim(), passwordInput.value);
                        window.location.href = ['admin', 'moderator'].includes(user.role)
                            ? '../admin/index.html'
                            : '../feed/index.html';
                    } catch (error) {
                        loginBtn.disabled = false;
                        btnText.textContent = 'Iniciar Sesión';
                        loginSpinner.classList.add('d-none');
                        snackBarMessage.textContent = error.status === 401
                            ? 'Correo o contraseña incorrectos. Si tu cuenta se creó antes de activar la base compartida, regístrala de nuevo desde este enlace.'
                            : error.message || 'Ocurrió un error inesperado';
                        snackBar.show();
                    }
                }
            });

            // Limpiar errores mientras el usuario escribe (mejora de UX)
            emailInput.addEventListener('input', () => emailInput.classList.remove('is-invalid'));
            passwordInput.addEventListener('input', () => passwordInput.classList.remove('is-invalid'));
        });
    </script>
</body>
</html>
